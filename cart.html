<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hiraya Watch Co. | Cart</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body class="d-flex flex-column min-vh-100">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg bg-body border-bottom fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold fs-3" href="index.html">Hiraya</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav flex-row flex-wrap gap-3 ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="products.html">Products</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="reviews.html">Reviews</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="cart.html">Cart (<span id="cartCount">0</span>)</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- Cart -->
        <main class="container py-5 mt-5 flex-grow-1">
            <h1 class="display-5 fw-bold mb-4">Your Cart</h1>
            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Watch</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items"></tbody>
                </table>
            </div>
            <div class="text-end mt-4">
                <h4>Total: <span id="total">&#8369;0.00</span></h4>
                <a href="products.html" class="btn btn-outline-dark">Keep shopping</a>
                <button type="button" id="clear-cart" class="btn btn-danger">Clear Cart</button>
                <button type="button" id="place-order" class="btn btn-dark">Place Order</button>
            </div>
            <div id="message" class="alert mt-3 d-none" role="status"></div>
        </main>
        <!-- Footer -->
        <footer class="bg-dark text-light py-4 mt-auto">
            <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
                <span>&copy; 2026 Hiraya Watch Co.<br />Crafted with Distinction in the Philippines</span>
                <span>
                    <a href="products.html" class="link-light me-3">Products</a>
                    <a href="reviews.html" class="link-light me-3">Reviews</a>
                    <a href="contact.html" class="link-light">Contact</a>
                </span>
            </div>
        </footer>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="index.js"></script>
    </body>
</html>
